name: Build ISO and ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential grub-pc-bin grub-efi-amd64-bin xorriso mtools qemu-system-x86 ovmf zip

      - name: Build kernel and ISO
        run: |
          set -euxo pipefail
          make clean
          make iso
          test -s build/kernel.elf
          test -s build/custom-os-minimal.iso
          file build/kernel.elf build/custom-os-minimal.iso
          grub-file --is-x86-multiboot2 build/kernel.elf

      - name: Smoke test ISO with UEFI firmware
        shell: bash
        timeout-minutes: 2
        run: |
          set -uo pipefail
          OVMF_CODE="/usr/share/OVMF/OVMF_CODE.fd"
          if [ ! -f "$OVMF_CODE" ]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
          fi
          if [ ! -f "$OVMF_CODE" ]; then
            echo "Could not find OVMF UEFI firmware package files"
            find /usr/share -iname '*OVMF*fd' -print || true
            exit 1
          fi
          set +e
          timeout 15s qemu-system-x86_64 \
            -machine q35 -m 256M \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -cdrom build/custom-os-minimal.iso \
            -display none -serial file:build/qemu-serial.log \
            -monitor none -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          echo "QEMU exit status: ${qemu_status} (124 is expected for a running kernel)"
          echo "----- serial output -----"
          if [ -f build/qemu-serial.log ]; then cat build/qemu-serial.log; else echo "No serial log file"; fi
          echo "-------------------------"
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "UEFI QEMU exited unexpectedly"; exit "$qemu_status"
          fi
          if [ ! -s build/qemu-serial.log ]; then
            echo "No serial output from the kernel. This indicates boot did not reach serial initialization, or serial logging is not configured."; exit 1
          fi
          grep -q 'KERNEL_READY' build/qemu-serial.log || { echo "Kernel did not emit KERNEL_READY."; exit 1; }
          grep -q 'CUSTOM OS MINIMAL' build/qemu-serial.log || { echo "Kernel did not emit its banner."; exit 1; }

      - name: Package ISO in ZIP
        run: |
          set -euxo pipefail
          sha256sum build/custom-os-minimal.iso > build/SHA256SUMS.txt
          mkdir -p dist
          cp build/custom-os-minimal.iso dist/
          cp build/SHA256SUMS.txt dist/
          (cd dist && zip -9 custom-os-minimal.zip custom-os-minimal.iso SHA256SUMS.txt)
          test -s dist/custom-os-minimal.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-minimal-zip
          path: dist/custom-os-minimal.zip
          if-no-files-found: error

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-minimal-iso
          path: build/custom-os-minimal.iso
          if-no-files-found: error
