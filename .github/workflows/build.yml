name: Build ISO and ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential grub-pc-bin grub-efi-amd64-bin xorriso mtools qemu-system-x86

      - name: Show toolchain versions
        run: |
          gcc --version
          ld --version
          grub-mkrescue --version
          qemu-system-x86_64 --version

      - name: Build kernel and ISO
        run: |
          set -euxo pipefail
          make clean
          make iso
          test -s build/kernel.elf
          test -s build/custom-os-minimal.iso

      - name: Smoke test in QEMU
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          timeout 20s qemu-system-x86_64 \
            -machine q35 -m 256M \
            -cdrom build/custom-os-minimal.iso \
            -display none -serial stdio -monitor none -no-reboot \
            2>&1 | tee build/qemu-smoke.log || test ${PIPESTATUS[0]} -eq 124
          grep -q 'KERNEL_READY' build/qemu-smoke.log
          grep -q 'CUSTOM OS MINIMAL' build/qemu-smoke.log

      - name: Package ISO in ZIP
        run: |
          set -euxo pipefail
          sha256sum build/custom-os-minimal.iso > build/SHA256SUMS.txt
          mkdir -p dist
          cp build/custom-os-minimal.iso dist/custom-os-minimal.iso
          cp build/SHA256SUMS.txt dist/SHA256SUMS.txt
          cd dist
          zip -9 custom-os-minimal.zip custom-os-minimal.iso SHA256SUMS.txt
          test -s custom-os-minimal.zip

      - name: Upload ISO ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-minimal-zip
          path: dist/custom-os-minimal.zip
          if-no-files-found: error

      - name: Upload standalone ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-minimal-iso
          path: build/custom-os-minimal.iso
          if-no-files-found: error
