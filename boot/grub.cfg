set timeout=3
set default=0

# Use GRUB's UEFI framebuffer where available; the kernel consumes the
# Multiboot2 framebuffer tag and draws its own text terminal.
terminal_output console

menuentry "Custom OS Minimal (UEFI/Multiboot2)" {
    insmod all_video
    insmod gfxterm
    set gfxmode=1024x768x32,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}
