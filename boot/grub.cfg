set default=0
set timeout=0
set timeout_style=hidden

# Keep GRUB output visible on the machine's display. Serial output is added
# as a secondary terminal for automated QEMU diagnostics.
if serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1; then
    terminal_input console serial
    terminal_output console serial
fi

menuentry "Custom OS Minimal" --id custom-os-minimal {
    echo "Loading Custom OS Minimal..."
    set root=$root
    if [ -f /boot/kernel.elf ]; then
        multiboot2 /boot/kernel.elf
        boot
    else
        echo "ERROR: /boot/kernel.elf not found on the boot media."
        sleep 5
    fi
}
