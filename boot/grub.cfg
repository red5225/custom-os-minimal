set default=0
set timeout=0
set timeout_style=hidden

# Keep the graphics mode active when control passes to the kernel.
# The kernel's first visible UI is its own C startup sequence.
insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,1024x768,auto
set gfxpayload=keep
terminal_output gfxterm

search --no-floppy --file --set=root /boot/kernel.elf

menuentry "Custom OS Minimal" --id custom-os-minimal {
    multiboot2 /boot/kernel.elf
    boot
}
