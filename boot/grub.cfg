set default=0
set timeout=0
set timeout_style=hidden

# This OS currently uses a text terminal, not a GRUB graphics menu.
# Force the firmware/console output early so GRUB does not try gfxterm
# and emit "error: no suitable video mode found" on machines without a
# GRUB-compatible graphics mode (including some UEFI/virtualized setups).
terminal_input console
terminal_output console

# Find the kernel on the active ESP or ISO filesystem.
search --no-floppy --file --set=root /boot/kernel.elf

menuentry "Custom OS Minimal" --id custom-os-minimal {
    echo "Loading Custom OS Minimal kernel..."
    multiboot2 /boot/kernel.elf
    boot
}
