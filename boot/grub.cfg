set timeout=0
set timeout_style=hidden
set default=0

# Mirror GRUB output to COM1 so headless UEFI tests can diagnose boot.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

menuentry "Custom OS Minimal (UEFI/Multiboot2)" {
    insmod all_video
    insmod gfxterm
    set gfxmode=1024x768x32,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}
