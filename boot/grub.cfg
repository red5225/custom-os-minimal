set default=0
set timeout=0
set timeout_style=hidden

# Ask GRUB for a graphics mode so Multiboot2 can hand the kernel a real
# framebuffer. Keep a text-console fallback if this firmware has no mode.
insmod all_video
insmod gfxterm
set gfxmode=auto
set gfxpayload=keep
if terminal_output gfxterm; then
    true
else
    terminal_output console
fi

search --no-floppy --file --set=root /boot/kernel.elf

menuentry "Custom OS Minimal" --id custom-os-minimal {
    echo "Loading Custom OS Minimal kernel..."
    multiboot2 /boot/kernel.elf
    boot
}
